id: llamaindex.query
name: LlamaIndex Query
description: Query a LlamaIndex index with synthesized response.
version: "0.1.0"
timeout_sec: 120
steps:
  query:
    id: query
    name: LlamaIndex Query Engine
    type: worker
    topic: job.llamaindex.query
    input:
      profile: ${input.profile}
      action: query
      config: ${input.index_config}
      input: ${input}
      request_id: ${input.request_id}
    input_schema_id: llamaindex/LlamaIndexQueryInput
    output_schema_id: llamaindex/LlamaIndexActionResult
    meta:
      pack_id: llamaindex
      capability: llamaindex.query
      risk_tags: ["read", "network", "llm"]
      requires: ["network:egress"]
