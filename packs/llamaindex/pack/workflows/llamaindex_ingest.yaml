id: llamaindex.ingest
name: LlamaIndex Document Ingest
description: Ingest documents into a LlamaIndex index.
version: "0.1.0"
timeout_sec: 300
steps:
  ingest:
    id: ingest
    name: LlamaIndex Document Ingestion
    type: worker
    topic: job.llamaindex.ingest
    input:
      profile: ${input.profile}
      action: ingest
      config: ${input.index_config}
      input: ${input}
      request_id: ${input.request_id}
    input_schema_id: llamaindex/LlamaIndexIngestInput
    output_schema_id: llamaindex/LlamaIndexActionResult
    meta:
      pack_id: llamaindex
      capability: llamaindex.ingest
      risk_tags: ["write", "network"]
      requires: ["network:egress"]
