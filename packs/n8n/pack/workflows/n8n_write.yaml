id: n8n.write
name: n8n Write
description: Execute or mutate n8n workflows through the generic dispatcher.
version: "0.1.0"
timeout_sec: 120
steps:
  write:
    id: write
    name: n8n write action
    type: worker
    topic: job.n8n.write
    input:
      profile: ${input.profile}
      request_id: ${input.request_id}
      action: ${input.action}
      params: ${input.params}
    input_schema_id: n8n/N8nActionInput
    output_schema_id: n8n/N8nActionResult
    meta:
      pack_id: n8n
      capability: n8n.write
      risk_tags: ["write", "network"]
      requires: ["network:egress"]
