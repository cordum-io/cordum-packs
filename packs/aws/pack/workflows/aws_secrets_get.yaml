id: aws.secrets.get
name: AWS Secrets Manager Get Secret
description: Retrieve a secret value from AWS Secrets Manager.
version: "0.1.0"
timeout_sec: 30
steps:
  get:
    id: get
    name: Secrets Manager GetSecretValue
    type: worker
    topic: job.aws.read
    input:
      profile: ${input.profile}
      action: secretsmanager.get_secret_value
      region: ${input.region}
      params: ${input.params}
      request_id: ${input.request_id}
    input_schema_id: aws/AWSSecretsManagerGetInput
    output_schema_id: aws/AWSActionResult
    meta:
      pack_id: aws
      capability: aws.read
      risk_tags: ["read", "network"]
      requires: ["network:egress"]
