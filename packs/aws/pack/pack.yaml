apiVersion: cordum.io/v1alpha1
kind: Pack

metadata:
  id: aws
  version: 0.1.0
  title: AWS
  description: AWS cloud integration — Lambda, S3, SQS, SNS, EC2, IAM, CloudWatch, Secrets Manager.
  image: https://cdn.simpleicons.org/amazonaws

compatibility:
  protocolVersion: 1
  minCoreVersion: 0.1.0

topics:
  - name: job.aws.read
    requires: ["network:egress"]
    riskTags: ["read", "network"]
    capability: aws.read

  - name: job.aws.write
    requires: ["network:egress"]
    riskTags: ["write", "network"]
    capability: aws.write

resources:
  schemas:
    - id: aws/AWSActionInput
      path: schemas/AWSActionInput.json
    - id: aws/AWSActionResult
      path: schemas/AWSActionResult.json
    - id: aws/AWSLambdaInvokeInput
      path: schemas/AWSLambdaInvokeInput.json
    - id: aws/AWSS3GetObjectInput
      path: schemas/AWSS3GetObjectInput.json
    - id: aws/AWSS3PutObjectInput
      path: schemas/AWSS3PutObjectInput.json
    - id: aws/AWSSQSSendMessageInput
      path: schemas/AWSSQSSendMessageInput.json
    - id: aws/AWSSNSPublishInput
      path: schemas/AWSSNSPublishInput.json
    - id: aws/AWSSecretsManagerGetInput
      path: schemas/AWSSecretsManagerGetInput.json
  workflows:
    - id: aws.read
      path: workflows/aws_read.yaml
    - id: aws.write
      path: workflows/aws_write.yaml
    - id: aws.lambda.invoke
      path: workflows/aws_lambda_invoke.yaml
    - id: aws.s3.get_object
      path: workflows/aws_s3_get_object.yaml
    - id: aws.s3.put_object
      path: workflows/aws_s3_put_object.yaml
    - id: aws.sqs.send_message
      path: workflows/aws_sqs_send_message.yaml
    - id: aws.sns.publish
      path: workflows/aws_sns_publish.yaml
    - id: aws.secrets.get
      path: workflows/aws_secrets_get.yaml

overlays:
  config:
    - name: pools
      scope: system
      key: pools
      strategy: json_merge_patch
      path: overlays/pools.patch.yaml
    - name: timeouts
      scope: system
      key: timeouts
      strategy: json_merge_patch
      path: overlays/timeouts.patch.yaml
  policy:
    - name: safety
      strategy: bundle_fragment
      path: overlays/policy.fragment.yaml

tests:
  policySimulations:
    - name: allow_read
      request:
        tenantId: default
        topic: job.aws.read
        riskTags: ["read", "network"]
      expectDecision: ALLOW
    - name: write_requires_approval
      request:
        tenantId: default
        topic: job.aws.write
        riskTags: ["write", "network"]
      expectDecision: REQUIRE_APPROVAL
