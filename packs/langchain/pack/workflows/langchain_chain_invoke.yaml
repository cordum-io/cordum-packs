id: langchain.chain.invoke
name: LangChain Chain Invoke
description: Execute a LangChain chain with input.
version: "0.1.0"
timeout_sec: 120
steps:
  chain:
    id: chain
    name: LangChain Chain Execution
    type: worker
    topic: job.langchain.chain
    input:
      profile: ${input.profile}
      action: chain.invoke
      config: ${input.chain_config}
      input: ${input.input}
      request_id: ${input.request_id}
    input_schema_id: langchain/LangChainChainInput
    output_schema_id: langchain/LangChainActionResult
    meta:
      pack_id: langchain
      capability: langchain.chain
      risk_tags: ["read", "network", "llm"]
      requires: ["network:egress"]
