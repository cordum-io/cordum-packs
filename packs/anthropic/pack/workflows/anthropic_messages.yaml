id: anthropic.messages
name: Anthropic Messages
description: Send a message to Claude and receive a complete response.
version: "0.1.0"
timeout_sec: 120
steps:
  messages:
    id: messages
    name: Anthropic Messages API
    type: worker
    topic: job.anthropic.messages
    input:
      profile: ${input.profile}
      action: messages.create
      params: ${input.params}
      request_id: ${input.request_id}
      auth: ${input.auth}
    input_schema_id: anthropic/AnthropicMessagesInput
    output_schema_id: anthropic/AnthropicActionResult
    meta:
      pack_id: anthropic
      capability: anthropic.messages
      risk_tags: ["read", "network", "llm"]
      requires: ["network:egress"]
