id: vertex-gemini-workflow
name: Vertex AI Gemini Generate
description: Generate Gemini content through Vertex AI with governance and approval.
version: "0.1.0"
timeout_sec: 120
steps:
  generate:
    id: generate
    name: Gemini content generation
    type: worker
    topic: job.vertexai.generate
    input:
      profile: ${input.profile}
      project_id: ${input.project_id}
      location: ${input.location}
      request_id: ${input.request_id}
      action: generate.generate_content
      params:
        model: ${input.model}
        prompt: ${input.prompt}
        messages: ${input.messages}
        system_instruction: ${input.system_instruction}
        generation_config: ${input.generation_config}
        safety_settings: ${input.safety_settings}
    input_schema_id: vertexai/VertexAIGenerateInput
    output_schema_id: vertexai/VertexAIActionResult
    meta:
      pack_id: vertexai
      capability: vertexai.generate
      risk_tags: ["generate", "ai", "network"]
      requires: ["network:egress"]
