id: vertexai.write
name: Vertex AI Write
description: Dispatch resource-intensive or mutating Vertex AI actions such as batch prediction and pipelines.
version: "0.1.0"
timeout_sec: 300
steps:
  write:
    id: write
    name: Vertex AI write action
    type: worker
    topic: job.vertexai.write
    input:
      profile: ${input.profile}
      project_id: ${input.project_id}
      location: ${input.location}
      request_id: ${input.request_id}
      action: ${input.action}
      params: ${input.params}
    input_schema_id: vertexai/VertexAIActionInput
    output_schema_id: vertexai/VertexAIActionResult
    meta:
      pack_id: vertexai
      capability: vertexai.write
      risk_tags: ["write", "network"]
      requires: ["network:egress"]
