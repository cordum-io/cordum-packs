apiVersion: cordum.io/v1alpha1
kind: Pack

metadata:
  id: gcp
  version: 0.1.0
  title: GCP
  description: Google Cloud integration — Cloud Functions, Cloud Storage, Pub/Sub, Compute Engine, Monitoring, Secret Manager, and IAM.
  image: https://cdn.simpleicons.org/googlecloud

compatibility:
  protocolVersion: 1
  minCoreVersion: 0.1.0

topics:
  - name: job.gcp.read
    requires: ["network:egress"]
    riskTags: ["read", "network"]
    capability: gcp.read

  - name: job.gcp.write
    requires: ["network:egress"]
    riskTags: ["write", "network"]
    capability: gcp.write

resources:
  schemas:
    - id: gcp/GCPActionInput
      path: schemas/GCPActionInput.json
    - id: gcp/GCPActionResult
      path: schemas/GCPActionResult.json
    - id: gcp/GCPFunctionCallInput
      path: schemas/GCPFunctionCallInput.json
    - id: gcp/GCPStorageGetObjectInput
      path: schemas/GCPStorageGetObjectInput.json
    - id: gcp/GCPStorageUploadObjectInput
      path: schemas/GCPStorageUploadObjectInput.json
    - id: gcp/GCPPubSubPublishInput
      path: schemas/GCPPubSubPublishInput.json
    - id: gcp/GCPSecretGetInput
      path: schemas/GCPSecretGetInput.json
  workflows:
    - id: gcp.read
      path: workflows/gcp_read.yaml
    - id: gcp.write
      path: workflows/gcp_write.yaml
    - id: gcp.functions.call
      path: workflows/gcp_function_call.yaml
    - id: gcp.storage.get_object
      path: workflows/gcp_storage_get_object.yaml
    - id: gcp.storage.upload_object
      path: workflows/gcp_storage_upload_object.yaml
    - id: gcp.pubsub.publish
      path: workflows/gcp_pubsub_publish.yaml
    - id: gcp.secretmanager.get
      path: workflows/gcp_secret_get.yaml

overlays:
  config:
    - name: pools
      scope: system
      key: pools
      strategy: json_merge_patch
      path: overlays/pools.patch.yaml
    - name: timeouts
      scope: system
      key: timeouts
      strategy: json_merge_patch
      path: overlays/timeouts.patch.yaml
  policy:
    - name: safety
      strategy: bundle_fragment
      path: overlays/policy.fragment.yaml

tests:
  policySimulations:
    - name: allow_read
      request:
        tenantId: default
        topic: job.gcp.read
        riskTags: ["read", "network"]
      expectDecision: ALLOW
    - name: write_requires_approval
      request:
        tenantId: default
        topic: job.gcp.write
        riskTags: ["write", "network"]
      expectDecision: REQUIRE_APPROVAL
