id: gcp.read
name: GCP Read
description: Read GCP metadata and data-plane resources through the generic dispatcher.
version: "0.1.0"
timeout_sec: 60
steps:
  read:
    id: read
    name: GCP Read action
    type: worker
    topic: job.gcp.read
    input:
      profile: ${input.profile}
      project_id: ${input.project_id}
      location: ${input.location}
      action: ${input.action}
      params: ${input.params}
      request_id: ${input.request_id}
    input_schema_id: gcp/GCPActionInput
    output_schema_id: gcp/GCPActionResult
    meta:
      pack_id: gcp
      capability: gcp.read
      risk_tags: ["read", "network"]
      requires: ["network:egress"]
