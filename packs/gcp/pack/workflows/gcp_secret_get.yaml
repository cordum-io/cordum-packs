id: gcp.secretmanager.get
name: GCP Secret Manager Get Secret
description: Access a secret version from Secret Manager.
version: "0.1.0"
timeout_sec: 30
steps:
  get:
    id: get
    name: Secret Manager Access Secret Version
    type: worker
    topic: job.gcp.read
    input:
      profile: ${input.profile}
      project_id: ${input.project_id}
      location: ${input.location}
      action: secretmanager.access_secret_version
      params:
        secret_id: ${input.secret_id}
        version: ${input.version}
      request_id: ${input.request_id}
    input_schema_id: gcp/GCPSecretGetInput
    output_schema_id: gcp/GCPActionResult
    meta:
      pack_id: gcp
      capability: gcp.read
      risk_tags: ["read", "network"]
      requires: ["network:egress"]
