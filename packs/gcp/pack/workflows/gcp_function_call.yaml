id: gcp.functions.call
name: GCP Cloud Function Call
description: Invoke a Google Cloud Function.
version: "0.1.0"
timeout_sec: 120
steps:
  call:
    id: call
    name: Cloud Function Call
    type: worker
    topic: job.gcp.write
    input:
      profile: ${input.profile}
      project_id: ${input.project_id}
      location: ${input.location}
      action: functions.call
      params:
        function_name: ${input.function_name}
        payload: ${input.payload}
      request_id: ${input.request_id}
    input_schema_id: gcp/GCPFunctionCallInput
    output_schema_id: gcp/GCPActionResult
    meta:
      pack_id: gcp
      capability: gcp.write
      risk_tags: ["write", "network"]
      requires: ["network:egress"]
