id: gcp.storage.upload_object
name: GCP Storage Upload Object
description: Upload an object to Cloud Storage.
version: "0.1.0"
timeout_sec: 120
steps:
  upload:
    id: upload
    name: Cloud Storage Upload Object
    type: worker
    topic: job.gcp.write
    input:
      profile: ${input.profile}
      project_id: ${input.project_id}
      location: ${input.location}
      action: storage.upload_object
      params:
        bucket: ${input.bucket}
        object_name: ${input.object_name}
        data: ${input.data}
        content_type: ${input.content_type}
        content_encoding: ${input.content_encoding}
      request_id: ${input.request_id}
    input_schema_id: gcp/GCPStorageUploadObjectInput
    output_schema_id: gcp/GCPActionResult
    meta:
      pack_id: gcp
      capability: gcp.write
      risk_tags: ["write", "network"]
      requires: ["network:egress"]
