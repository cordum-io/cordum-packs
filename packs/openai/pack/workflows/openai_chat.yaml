id: openai.chat
name: OpenAI Chat Completion
description: Generate a chat completion with OpenAI models.
version: "0.1.0"
timeout_sec: 120
steps:
  chat:
    id: chat
    name: Chat completion
    type: worker
    topic: job.openai.chat
    input:
      profile: ${input.profile}
      action: chat.completions
      model: ${input.model}
      messages: ${input.messages}
      temperature: ${input.temperature}
      max_tokens: ${input.max_tokens}
      tools: ${input.tools}
      tool_choice: ${input.tool_choice}
      response_format: ${input.response_format}
      stream: false
    input_schema_id: openai/OpenAIChatCompletionInput
    output_schema_id: openai/OpenAIActionResult
    meta:
      pack_id: openai
      capability: openai.chat
      risk_tags: ["read", "llm"]
      requires: ["network:egress"]
