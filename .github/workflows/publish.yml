name: Publish Packs

on:
  push:
    branches: ["main"]
    paths:
      - "packs/**"
      - "tools/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint_security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt ruff bandit

      - name: Lint Python
        run: ruff check tools

      - name: Bandit scan
        run: bandit -r tools

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go format check
        run: |
          set -euo pipefail
          files="$(find packs -name '*.go' -type f -not -path '*/vendor/*')"
          if [ -n "$files" ]; then
            unformatted="$(gofmt -l $files)"
            if [ -n "$unformatted" ]; then
              echo "gofmt required for:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Verify dependency token
        env:
          CORDUM_DEPS_TOKEN: ${{ secrets.CORDUM_DEPS_TOKEN }}
        run: |
          if [ -z "${CORDUM_DEPS_TOKEN}" ]; then
            echo "::error::Missing CORDUM_DEPS_TOKEN (needs read access to cordum-io/cap and cordum-io/cordum)."
            exit 1
          fi

      - name: Checkout Go dependency sources
        uses: actions/checkout@v4
        with:
          repository: cordum-io/cap
          path: .deps/cap
          fetch-depth: 1
          token: ${{ secrets.CORDUM_DEPS_TOKEN }}

      - name: Checkout Cordum SDK source
        uses: actions/checkout@v4
        with:
          repository: cordum-io/cordum
          path: .deps/cordum
          fetch-depth: 1
          token: ${{ secrets.CORDUM_DEPS_TOKEN }}

      - name: Link local replaces
        run: |
          set -euo pipefail
          if [ ! -e packs/cap ]; then
            ln -s "$GITHUB_WORKSPACE/.deps/cap" packs/cap
          fi
          if [ ! -e packs/cordum ]; then
            ln -s "$GITHUB_WORKSPACE/.deps/cordum" packs/cordum
          fi

      - name: Go tests
        run: |
          set -euo pipefail
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "Testing $dir"
            (cd "$dir" && go test ./...)
          done < <(find packs -maxdepth 3 -name go.mod)

      - name: Gosec scan
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "Scanning $dir"
            (cd "$dir" && gosec ./...)
          done < <(find packs -maxdepth 3 -name go.mod)

  build:
    needs: lint_security
    runs-on: ubuntu-latest
    env:
      PACKS_BASE_URL: ${{ secrets.PACKS_BASE_URL }}
      PACKS_DOMAIN: ${{ secrets.PACKS_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Build catalog + bundles
        run: python tools/build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload public artifact
        uses: actions/upload-artifact@v6
        with:
          name: public
          path: public


      - name: Upload deploy artifact
        uses: actions/upload-artifact@v6
        with:
          name: deploy
          path: deploy

  deploy_pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy_server:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    env:
      PACKS_TELEMETRY_INSTALL: ${{ secrets.PACKS_TELEMETRY_INSTALL }}
      PACKS_STATS_INSTALL: ${{ secrets.PACKS_STATS_INSTALL }}
    steps:
      - name: Download public artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public


      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy
          path: deploy

      - name: Configure SSH
        env:
          PACKS_DEPLOY_KEY: ${{ secrets.PACKS_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PACKS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${PACKS_DEPLOY_KEY:-}" ]; then
            echo "PACKS_DEPLOY_KEY secret is required" >&2
            exit 1
          fi
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "PACKS_DEPLOY_HOST secret is required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$PACKS_DEPLOY_KEY" > ~/.ssh/cordum_packs_deploy
          chmod 600 ~/.ssh/cordum_packs_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Install telemetry logging config (optional)
        if: env.PACKS_TELEMETRY_INSTALL == '1'
        env:
          DEPLOY_HOST: ${{ secrets.PACKS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PACKS_DEPLOY_USER }}
          TELEMETRY_CONF_PATH: ${{ secrets.PACKS_TELEMETRY_CONF_PATH }}
          TELEMETRY_LOGROTATE_PATH: ${{ secrets.PACKS_TELEMETRY_LOGROTATE_PATH }}
          TELEMETRY_TMP: ${{ secrets.PACKS_TELEMETRY_TMP }}
          RELOAD_NGINX: ${{ secrets.PACKS_RELOAD_NGINX }}
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST:-92.205.177.179}"
          DEPLOY_USER="${DEPLOY_USER:-sysadmin}"
          TELEMETRY_CONF_PATH="${TELEMETRY_CONF_PATH:-/etc/nginx/conf.d/packs.cordum.io.telemetry.conf}"
          TELEMETRY_LOGROTATE_PATH="${TELEMETRY_LOGROTATE_PATH:-/etc/logrotate.d/packs.cordum.io}"
          TELEMETRY_TMP="${TELEMETRY_TMP:-/tmp/cordum-packs-telemetry}"
          RELOAD_NGINX="${RELOAD_NGINX:-1}"

          ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p \"$TELEMETRY_TMP\""

          rsync -az -e "ssh -i ~/.ssh/cordum_packs_deploy" deploy/nginx/packs.cordum.io.telemetry.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$TELEMETRY_TMP/packs.cordum.io.telemetry.conf"
          rsync -az -e "ssh -i ~/.ssh/cordum_packs_deploy" deploy/logrotate/packs.cordum.io \
            "$DEPLOY_USER@$DEPLOY_HOST:$TELEMETRY_TMP/packs.cordum.io.logrotate"

          CONF_DIR="$(dirname "$TELEMETRY_CONF_PATH")"
          LOGROTATE_DIR="$(dirname "$TELEMETRY_LOGROTATE_PATH")"

          ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo mkdir -p \"$CONF_DIR\" \"$LOGROTATE_DIR\" \
            && sudo mv \"$TELEMETRY_TMP/packs.cordum.io.telemetry.conf\" \"$TELEMETRY_CONF_PATH\" \
            && sudo mv \"$TELEMETRY_TMP/packs.cordum.io.logrotate\" \"$TELEMETRY_LOGROTATE_PATH\" \
            && sudo nginx -t"

          if [ "$RELOAD_NGINX" = "1" ]; then
            ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" "sudo systemctl reload nginx"
          fi

      - name: Install stats dashboard (optional)
        if: env.PACKS_STATS_INSTALL == '1'
        env:
          DEPLOY_HOST: ${{ secrets.PACKS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PACKS_DEPLOY_USER }}
          STATS_ROOT: ${{ secrets.PACKS_STATS_ROOT }}
          STATS_SCRIPT_PATH: ${{ secrets.PACKS_STATS_SCRIPT_PATH }}
          STATS_CRON_PATH: ${{ secrets.PACKS_STATS_CRON_PATH }}
          STATS_HTPASSWD_PATH: ${{ secrets.PACKS_STATS_HTPASSWD_PATH }}
          STATS_NGINX_SNIPPET_PATH: ${{ secrets.PACKS_STATS_NGINX_SNIPPET_PATH }}
          STATS_BASIC_USER: ${{ secrets.PACKS_STATS_BASIC_USER }}
          STATS_BASIC_PASS: ${{ secrets.PACKS_STATS_BASIC_PASS }}
          STATS_TMP: ${{ secrets.PACKS_STATS_TMP }}
          RELOAD_NGINX: ${{ secrets.PACKS_RELOAD_NGINX }}
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST:-92.205.177.179}"
          DEPLOY_USER="${DEPLOY_USER:-sysadmin}"
          STATS_ROOT="${STATS_ROOT:-/var/www/packs.cordum.io/stats}"
          STATS_SCRIPT_PATH="${STATS_SCRIPT_PATH:-/opt/cordum-packs/build_stats.py}"
          STATS_CRON_PATH="${STATS_CRON_PATH:-/etc/cron.d/cordum-packs-stats}"
          STATS_HTPASSWD_PATH="${STATS_HTPASSWD_PATH:-/etc/nginx/.htpasswd_packs_stats}"
          STATS_NGINX_SNIPPET_PATH="${STATS_NGINX_SNIPPET_PATH:-/etc/nginx/snippets/packs.cordum.io.stats.location.conf}"
          STATS_TMP="${STATS_TMP:-/tmp/cordum-packs-stats}"
          RELOAD_NGINX="${RELOAD_NGINX:-1}"

          if [ -z "${STATS_BASIC_USER:-}" ] || [ -z "${STATS_BASIC_PASS:-}" ]; then
            echo "PACKS_STATS_BASIC_USER and PACKS_STATS_BASIC_PASS are required" >&2
            exit 1
          fi

          ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p \"$STATS_TMP\""

          rsync -az -e "ssh -i ~/.ssh/cordum_packs_deploy" deploy/scripts/build_stats.py \
            "$DEPLOY_USER@$DEPLOY_HOST:$STATS_TMP/build_stats.py"
          rsync -az -e "ssh -i ~/.ssh/cordum_packs_deploy" deploy/stats/index.html \
            "$DEPLOY_USER@$DEPLOY_HOST:$STATS_TMP/index.html"
          rsync -az -e "ssh -i ~/.ssh/cordum_packs_deploy" deploy/cron/cordum-packs-stats \
            "$DEPLOY_USER@$DEPLOY_HOST:$STATS_TMP/cordum-packs-stats"
          rsync -az -e "ssh -i ~/.ssh/cordum_packs_deploy" deploy/nginx/packs.cordum.io.stats.location.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$STATS_TMP/packs.cordum.io.stats.location.conf"

          STATS_SCRIPT_DIR="$(dirname "$STATS_SCRIPT_PATH")"
          STATS_CRON_DIR="$(dirname "$STATS_CRON_PATH")"
          STATS_HTPASSWD_DIR="$(dirname "$STATS_HTPASSWD_PATH")"
          STATS_SNIPPET_DIR="$(dirname "$STATS_NGINX_SNIPPET_PATH")"

          ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo mkdir -p \"$STATS_SCRIPT_DIR\" \"$STATS_ROOT\" \"$STATS_CRON_DIR\" \"$STATS_HTPASSWD_DIR\" \"$STATS_SNIPPET_DIR\" \
            && sudo mv \"$STATS_TMP/build_stats.py\" \"$STATS_SCRIPT_PATH\" \
            && sudo mv \"$STATS_TMP/index.html\" \"$STATS_ROOT/index.html\" \
            && sudo mv \"$STATS_TMP/cordum-packs-stats\" \"$STATS_CRON_PATH\" \
            && sudo mv \"$STATS_TMP/packs.cordum.io.stats.location.conf\" \"$STATS_NGINX_SNIPPET_PATH\" \
            && sudo chmod +x \"$STATS_SCRIPT_PATH\""

          HASH="$(openssl passwd -apr1 "$STATS_BASIC_PASS")"
          ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "printf \'%s:%s\\n\' \"$STATS_BASIC_USER\" \"$HASH\" | sudo tee \"$STATS_HTPASSWD_PATH\" >/dev/null"

          ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "PACKS_TELEMETRY_LOG=/var/log/nginx/packs.cordum.io.access.json \
            PACKS_STATS_DIR=\"$STATS_ROOT\" \
            PACKS_STATS_WINDOW_DAYS=7 \
            sudo /usr/bin/python3 \"$STATS_SCRIPT_PATH\""

          if [ "$RELOAD_NGINX" = "1" ]; then
            ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" "sudo nginx -t && sudo systemctl reload nginx"
          fi

      - name: Upload to server
        env:
          DEPLOY_HOST: ${{ secrets.PACKS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PACKS_DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.PACKS_DEPLOY_ROOT }}
          DEPLOY_TMP: ${{ secrets.PACKS_DEPLOY_TMP }}
          RELOAD_NGINX: ${{ secrets.PACKS_RELOAD_NGINX }}
        run: |
          set -euo pipefail
          DEPLOY_HOST="${DEPLOY_HOST:-92.205.177.179}"
          DEPLOY_USER="${DEPLOY_USER:-sysadmin}"
          DEPLOY_ROOT="${DEPLOY_ROOT:-/var/www/packs.cordum.io}"
          DEPLOY_TMP="${DEPLOY_TMP:-/tmp/cordum-packs-public}"
          RELOAD_NGINX="${RELOAD_NGINX:-1}"

          rsync -az --delete -e "ssh -i ~/.ssh/cordum_packs_deploy" public/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_TMP/"

          ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo mkdir -p $DEPLOY_ROOT && sudo rsync -a --delete $DEPLOY_TMP/ $DEPLOY_ROOT/"

          if [ "$RELOAD_NGINX" = "1" ]; then
            ssh -i ~/.ssh/cordum_packs_deploy "$DEPLOY_USER@$DEPLOY_HOST" "sudo nginx -t && sudo systemctl reload nginx"
          fi
