# Safety policy for CrewAI crew — matches the tutorial scaffold.
# Generated by: cordumctl init --framework crewai
default_decision: deny
output_policy:
  enabled: true
  fail_mode: closed
default_tenant: default
tenants:
  default:
    allow_topics:
      - "job.default"
    deny_topics:
      - "sys.*"
    allowed_repo_hosts: []
    denied_repo_hosts: []
    mcp:
      allow_servers: []
      deny_servers: []
      allow_tools: []
      deny_tools: []
      allow_resources: []
      deny_resources: []
      allow_actions: []
      deny_actions: []
rules:
  - id: allow-crew-tasks
    match:
      topics: ["job.default"]
    decision: allow
input_rules:
  - id: deny-pii-input
    scanners: ["pii"]
    decision: deny
    severity: high
    reason: "Input contains PII — redact before submitting"
  - id: require-approval-sensitive
    keywords: ["delete.*production", "drop.*table", "admin.*access"]
    decision: require_approval
    severity: high
    reason: "Task involves sensitive operations — human approval required"
