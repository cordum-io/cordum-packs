# Safety policy for LangGraph agent — matches the tutorial scaffold.
# Generated by: cordumctl init --framework langchain
default_decision: deny
output_policy:
  enabled: true
  fail_mode: closed
default_tenant: default
tenants:
  default:
    allow_topics:
      - "job.default"
    deny_topics:
      - "sys.*"
    allowed_repo_hosts: []
    denied_repo_hosts: []
    mcp:
      allow_servers: []
      deny_servers: []
      allow_tools: []
      deny_tools: []
      allow_resources: []
      deny_resources: []
      allow_actions: []
      deny_actions: []
rules:
  - id: allow-research
    match:
      topics: ["job.default"]
    decision: allow
input_rules:
  - id: deny-pii-queries
    scanners: ["pii"]
    decision: deny
    severity: high
    reason: "Query contains PII (SSN or credit card number)"
