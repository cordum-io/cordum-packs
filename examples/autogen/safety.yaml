# Safety policy for AutoGen multi-agent system — matches the tutorial scaffold.
# Generated by: cordumctl init --framework autogen
default_decision: deny
output_policy:
  enabled: true
  fail_mode: closed
default_tenant: default
tenants:
  default:
    allow_topics:
      - "job.default"
    deny_topics:
      - "sys.*"
    allowed_repo_hosts: []
    denied_repo_hosts: []
    mcp:
      allow_servers: []
      deny_servers: []
      allow_tools: []
      deny_tools: []
      allow_resources: []
      deny_resources: []
      allow_actions: []
      deny_actions: []
rules:
  - id: allow-agent-tasks
    match:
      topics: ["job.default"]
    decision: allow
  - id: rate-limit-agents
    match:
      topics: ["job.default"]
    velocity:
      max_requests: 10
      window_seconds: 60
    decision: allow
input_rules:
  - id: deny-injection
    scanners: ["prompt_injection"]
    decision: deny
    severity: high
    reason: "Input contains prompt injection pattern"
