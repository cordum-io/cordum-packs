# Telemetry access log for packs.cordum.io.
# Include this file in the Nginx http context (conf.d is usually included there).

map "$host$uri" $cordum_pack_event {
  default "other";
  ~^packs\.cordum\.io/catalog\.json(?:\?|$) "catalog_fetch";
  ~^packs\.cordum\.io/packs/([^/]+)/([^/]+)/pack\.tgz(?:\?|$) "pack_download";
}

map "$host$uri" $cordum_pack_id {
  default "";
  ~^packs\.cordum\.io/packs/([^/]+)/([^/]+)/pack\.tgz(?:\?|$) $1;
}

map "$host$uri" $cordum_pack_version {
  default "";
  ~^packs\.cordum\.io/packs/([^/]+)/([^/]+)/pack\.tgz(?:\?|$) $2;
}

map $cordum_pack_event $cordum_pack_loggable {
  default 0;
  "catalog_fetch" 1;
  "pack_download" 1;
}

log_format cordum_packs_telemetry escape=json '{'
  '"ts":"$time_iso8601",'
  '"event":"$cordum_pack_event",'
  '"pack_id":"$cordum_pack_id",'
  '"pack_version":"$cordum_pack_version",'
  '"install_id":"$arg_install_id",'
  '"method":"$request_method",'
  '"host":"$host",'
  '"uri":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"remote_addr":"$remote_addr",'
  '"xff":"$http_x_forwarded_for",'
  '"cf_ip":"$http_cf_connecting_ip",'
  '"cf_country":"$http_cf_ipcountry",'
  '"cf_ray":"$http_cf_ray",'
  '"user_agent":"$http_user_agent",'
  '"accept_language":"$http_accept_language",'
  '"tls_protocol":"$ssl_protocol",'
  '"tls_cipher":"$ssl_cipher"'
'}';

access_log /var/log/nginx/packs.cordum.io.access.json cordum_packs_telemetry if=$cordum_pack_loggable;
