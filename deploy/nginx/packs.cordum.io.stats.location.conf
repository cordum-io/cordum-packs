# Include this snippet inside the packs.cordum.io server block.
# It assumes the server root is /var/www/packs.cordum.io.

location /stats/ {
  auth_basic "Cordum Packs Stats";
  auth_basic_user_file /etc/nginx/.htpasswd_packs_stats;
  try_files $uri $uri/ /stats/index.html;
  add_header Cache-Control "no-store" always;
}
